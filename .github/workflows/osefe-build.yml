name: Build Osefe Engine (Windows)

on:
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows Editor (x86_64, MSVC)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SCons
        run: python -m pip install scons

      - name: Build (Vulkan-only, no extra deps)
        run: scons platform=windows target=editor arch=x86_64 werror=no d3d12=no winrt=no accesskit=no angle=no -j15
        shell: cmd

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: osefe-editor-windows
          path: bin/*.exe
          retention-days: 14
